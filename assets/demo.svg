<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="Dork Scout — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">Dork Scout — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#6f8a5e">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.72s steps(16) 0.60s forwards" fill="#e5e7eb">pip install -e .</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.62s forwards" fill="#94a3b8">Obtaining file://.../dork-scout</text>
<text x="50" y="126" class="l" style="animation:show .01s 1.84s forwards" fill="#4ade80">Successfully installed dork-scout httpx beautifulsoup4</text>
<text x="50" y="152" class="l" style="animation:show .01s 2.06s forwards" fill="#94a3b8">You can now run: dork-scout</text>
<text x="28" y="204" class="l" style="animation:show .01s 2.63s forwards"><tspan fill="#6f8a5e">❯</tspan></text><text x="50" y="204" class="l ty" style="animation:show .01s 2.63s forwards,type 0.45s steps(10) 2.63s forwards" fill="#e5e7eb">dork-scout</text>
<text x="50" y="230" class="l" style="animation:show .01s 3.38s forwards" fill="#94a3b8">Dork Scout v0.1.0 starting...</text>
<text x="50" y="256" class="l" style="animation:show .01s 3.60s forwards" fill="#94a3b8">Visit http://localhost:8000</text>
<text x="50" y="282" class="l" style="animation:show .01s 3.82s forwards" fill="#94a3b8">Loaded 340 dorks across 18 categories</text>
<text x="50" y="308" class="l" style="animation:show .01s 4.04s forwards" fill="#94a3b8">Ready for discovery</text>
<text x="28" y="360" class="l" style="animation:show .01s 4.61s forwards"><tspan fill="#6f8a5e">❯</tspan></text><text x="50" y="360" class="l ty" style="animation:show .01s 4.61s forwards,type 2.20s steps(60) 4.61s forwards" fill="#e5e7eb">curl -s &apos;http://localhost:8000/api/categories&apos; | head -c 180</text>
<text x="50" y="386" class="l" style="animation:show .01s 7.11s forwards" fill="#94a3b8">{&quot;categories&quot;:[{&quot;slug&quot;:&quot;payment-gateways&quot;,&quot;name&quot;:&quot;Payment Gateways&quot;,&quot;count&quot;:…</text>
<text x="50" y="412" class="l" style="animation:show .01s 7.33s forwards" fill="#94a3b8">{&quot;slug&quot;:&quot;ecommerce-platforms&quot;,&quot;name&quot;:&quot;Ecommerce Platforms&quot;,&quot;count&quot;:38},</text>
<text x="50" y="438" class="l" style="animation:show .01s 7.55s forwards" fill="#94a3b8">{&quot;slug&quot;:&quot;product-shoes&quot;,&quot;name&quot;:&quot;Shoes Stores&quot;,&quot;count&quot;:27}]}</text>
<text x="28" y="490" class="l" style="animation:show .01s 8.12s forwards"><tspan fill="#6f8a5e">❯</tspan></text><text x="50" y="490" class="l ty" style="animation:show .01s 8.12s forwards,type 2.20s steps(77) 8.12s forwards" fill="#e5e7eb">curl -s &apos;http://localhost:8000/api/search?category=payment-gateways&amp;tech=str…</text>
<text x="50" y="516" class="l" style="animation:show .01s 10.62s forwards" fill="#94a3b8">https://www.shoepalace.com</text>
<g class="l" style="animation:show .01s 10.84s forwards"><text x="28" y="542" fill="#6f8a5e">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
